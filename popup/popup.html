<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Activity Monitor</h1>
      <div class="status-indicator" id="statusIndicator"></div>
    </div>
    
    <div class="section">
      <h3>Monitoring Status</h3>
      <div class="toggle-group">
        <label class="toggle">
          <input type="checkbox" id="toggleKeyboard">
          <span class="toggle-label">Keyboard Monitor</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleMouse">
          <span class="toggle-label">Mouse Monitor</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleNetwork">
          <span class="toggle-label">Network Monitor</span>
        </label>
      </div>
    </div>
    
    <div class="section">
      <h3>Real-time Data</h3>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="keyCount">0</div>
          <div class="stat-label">Key Presses</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="clickCount">0</div>
          <div class="stat-label">Clicks</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="networkCount">0</div>
          <div class="stat-label">Network Requests</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="activityScore">0</div>
          <div class="stat-label">Activity Score</div>
        </div>
      </div>
    </div>
    
    <div class="section">
      <div class="section-header">
        <h3>Recent Activities</h3>
        <div class="section-actions">
          <button id="clearActivities" class="clear-btn" title="Clear activities">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18"></path>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
          <button id="refreshActivities" class="refresh-btn" title="Refresh activities">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"></path>
              <path d="M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="activity-list" id="activityList">
        <div class="empty-state">No activity records</div>
      </div>
    </div>
    
    <div class="section">
      <h3>Privacy Settings</h3>
      <select id="privacyLevel" class="select">
        <option value="low">Low - Collect full data</option>
        <option value="medium" selected>Medium - Anonymized</option>
        <option value="high">High - Minimal collection</option>
      </select>
    </div>
    
    <div class="section">
      <h3>Activity Replay</h3>
      <div class="replay-controls">
        <select id="replayTimeRange" class="select">
          <option value="1">Last 1 minute</option>
          <option value="5" selected>Last 5 minutes</option>
          <option value="10">Last 10 minutes</option>
          <option value="all">All recorded activities</option>
        </select>
        <select id="replaySpeed" class="select">
          <option value="0.5">0.5x Slow</option>
          <option value="1" selected>1x Normal</option>
          <option value="2">2x Fast</option>
          <option value="5">5x Very Fast</option>
        </select>
        <button id="replayActivities" class="btn btn-primary">Replay</button>
        <button id="stopReplay" class="btn btn-secondary">Stop</button>
      </div>
    </div>
    
    <div class="button-group">
      <button id="exportData" class="btn btn-secondary">Export Data</button>
      <button id="importData" class="btn btn-secondary">Import Data</button>
      <input type="file" id="importFile" style="display: none;" accept=".json">
      <button id="clearData" class="btn btn-secondary">Clear Data</button>
      <button id="openOptions" class="btn btn-primary">Settings</button>
    </div>
    
    <div class="footer">
      <div class="session-info">
        Session ID: <span id="sessionId">-</span>
      </div>
      <div class="last-update">
        Last Update: <span id="lastUpdate">-</span>
      </div>
    </div>
  </div>
  
  <!-- Network Activity Modal -->
  <div id="networkModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Network Activity Details</h3>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Content will be populated dynamically -->
      </div>
    </div>
  </div>
  
  <!-- Mouse Activity Modal -->
  <div id="mouseModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Mouse Activity Details</h3>
        <button class="modal-close" id="closeMouseModal">&times;</button>
      </div>
      <div class="modal-body" id="mouseModalBody">
        <!-- Content will be populated dynamically -->
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
